name: mobile
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

workspace:
  - packages/core_ui
  - packages/core_services
  - packages/zone

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.0.0

  core_ui:
    path: packages/core_ui
  core_services:
    path: packages/core_services
  zone:
    path: packages/zone
  inbound:
    path: packages/inbound
  flutter_dotenv: ^6.0.1
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  melos: ^7.5.1
  get_it: ^9.2.1
  flutter_staggered_grid_view: ^0.6.2

flutter:
  uses-material-design: true

  assets:
    - .env

melos:
  scripts:
    analyze:
      description: "Run Flutter analyzer across all workspace packages"
      run: dart run melos exec -- "flutter analyze"
